# Atualizações automáticas de dependências (abre PRs semanais).
# Também avisa de vulnerabilidades conhecidas, independentemente deste agendamento.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/EduAssess"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
